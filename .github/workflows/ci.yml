name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare environment
        run: cp .env.example .env
      - name: Build backend image
        run: docker compose build api
      - name: Start PostgreSQL, Redis, object storage and the development identity provider
        run: docker compose up -d --wait db redis oidc storage
      - name: Lint
        run: docker compose run --rm -T api sh -c "ruff check . && ruff format --check ."
      - name: Type-check
        run: docker compose run --rm -T api mypy app
      - name: Migrations apply from empty and are reversible to base
        run: |
          docker compose run --rm -T migrate
          docker compose run --rm -T api alembic downgrade base
          docker compose run --rm -T api alembic upgrade head
      # Tests that need the private reference workbook report as skipped here.
      - name: Tests (PostgreSQL, runtime role)
        run: docker compose run --rm -T api pytest
      - name: OpenAPI document is current
        run: |
          docker compose run --rm -T api python -m app.export_openapi > /tmp/openapi.json
          diff -u frontend/openapi.json /tmp/openapi.json

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated client is current
        run: |
          pnpm gen:api
          git diff --exit-code src/api/schema.d.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production API image
        run: docker build --target prod -t crm-api:ci backend
      - name: Build production frontend image
        run: docker build --target prod -t crm-frontend:ci frontend
      - name: API image runs as a non-root user
        run: test "$(docker run --rm crm-api:ci id -u)" != "0"
