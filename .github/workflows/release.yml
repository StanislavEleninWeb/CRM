name: release

# Build once, publish images under an immutable tag, deploy that exact digest to staging, check it,
# then offer the same digest to production behind the repository's environment protection.
#
# What this file cannot do by itself, and what has to be configured in the repository settings:
#   - Environments "staging" and "production", each with the variables and secrets named below.
#   - Required reviewers on "production": without that rule the production job is not gated.
# Until a host exists the deploy jobs skip themselves and say so.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  images:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      api: ${{ steps.push.outputs.api }}
      frontend: ${{ steps.push.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to the registry
        run: echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
      - name: Build
        run: |
          docker build --target prod -t crm-api:release backend
          docker build --target prod -t crm-frontend:release frontend
      - name: Images contain no secrets and do not run as root
        run: ./infra/checks/image-checks.sh crm-api:release crm-frontend:release
      - name: Publish under the commit, never under a moving tag
        id: push
        run: |
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          for name in api frontend; do
            ref="ghcr.io/$owner/crm-$name:$SHA"
            docker tag "crm-$name:release" "$ref"
            docker push "$ref"
            digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$ref")"
            echo "$name=$digest" >> "$GITHUB_OUTPUT"
            echo "- \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          done
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}

  staging:
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy the built digests
        run: ./infra/deploy/remote.sh
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          API_IMAGE: ${{ needs.images.outputs.api }}
          FRONTEND_IMAGE: ${{ needs.images.outputs.frontend }}
      - name: Smoke test
        run: ./infra/checks/smoke-remote.sh
        env:
          BASE_URL: ${{ vars.PUBLIC_BASE_URL }}

  production:
    # The same digests that passed staging. Waits for approval if the environment requires reviewers.
    needs: [images, staging]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy the digests that passed staging
        run: ./infra/deploy/remote.sh
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          API_IMAGE: ${{ needs.images.outputs.api }}
          FRONTEND_IMAGE: ${{ needs.images.outputs.frontend }}
      - name: Smoke test
        run: ./infra/checks/smoke-remote.sh
        env:
          BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
