# Used on the production server together with compose.yaml. The server already runs Apache on ports
# 80 and 443 for other projects, so the bundled proxy is not started; the two application services
# are published on the loopback interface only, for Apache to forward to (apache-crm.seweb.co.conf).
services:
  api:
    ports: ["127.0.0.1:${API_HOST_PORT:-18000}:8000"]
  frontend:
    ports: ["127.0.0.1:${FRONTEND_HOST_PORT:-18080}:8080"]
