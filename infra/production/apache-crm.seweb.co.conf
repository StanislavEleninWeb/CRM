# Apache virtual host for crm.seweb.co. The server already runs Apache for other projects, so the
# CRM does not bring a proxy of its own: its two services listen on the loopback interface only
# (compose.host-proxy.yaml) and Apache forwards to them.
#
# Install:  copy to /etc/apache2/sites-available/crm.seweb.co.conf, then
#           a2enmod ssl proxy proxy_http headers rewrite && a2ensite crm.seweb.co && apache2ctl configtest && systemctl reload apache2
#
# The name is proxied by Cloudflare, so:
#   - the certificate is a Cloudflare Origin Certificate placed by hand in /etc/seweb-crm/edge/,
#     and Cloudflare's SSL mode is "Full (strict)";
#   - only Cloudflare may connect: it presents a client certificate (Authenticated Origin Pulls),
#     and a request that reaches the server's address directly is refused during the TLS handshake.

<VirtualHost *:80>
    ServerName crm.seweb.co
    # Cloudflare talks to this server over HTTPS only. Anything arriving here is sent there.
    Redirect permanent / https://crm.seweb.co/
</VirtualHost>

<VirtualHost *:443>
    ServerName crm.seweb.co

    SSLEngine on
    SSLCertificateFile      /etc/seweb-crm/edge/origin.pem
    SSLCertificateKeyFile   /etc/seweb-crm/edge/origin.key
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    # Authenticated Origin Pulls: no certificate from Cloudflare, no connection.
    SSLCACertificateFile    /etc/seweb-crm/edge/cloudflare-origin-pull-ca.pem
    SSLVerifyClient         require
    SSLVerifyDepth          1

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

    # Uploads: prospect lists and attachments. A request that declares more than 25 MB is refused here,
    # before any of it is forwarded. (Apache's LimitRequestBody is not applied to forwarded requests,
    # so the declared length is checked instead; the application has its own limit of 20 MB per file.)
    RewriteEngine On
    RewriteCond expr "%{HTTP:Content-Length} -gt 26214400"
    RewriteRule ^ - [R=413,L]

    # Monitoring figures are not served to the internet: excluded from forwarding, and answered 404.
    ProxyPass        /ops     !
    RedirectMatch 404 ^/ops(/|$)

    ProxyRequests       Off
    ProxyPreserveHost   On
    ProxyTimeout        60
    # Forwarding headers are set here rather than added by Apache: the connecting address is always
    # Cloudflare's, and the visitor's is the one Cloudflare reports.
    ProxyAddHeaders     Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host  "crm.seweb.co"
    RequestHeader set X-Forwarded-For   "expr=%{req:CF-Connecting-IP}"

    # The API, and the two health addresses the deployment checks.
    ProxyPass        /api/    http://127.0.0.1:18000/api/
    ProxyPassReverse /api/    http://127.0.0.1:18000/api/
    ProxyPass        /healthz http://127.0.0.1:18000/healthz
    ProxyPass        /readyz  http://127.0.0.1:18000/readyz

    # Everything else: the pages.
    ProxyPass        /        http://127.0.0.1:18080/
    ProxyPassReverse /        http://127.0.0.1:18080/

    ErrorLog  ${APACHE_LOG_DIR}/crm.seweb.co-error.log
    CustomLog ${APACHE_LOG_DIR}/crm.seweb.co-access.log combined
</VirtualHost>
