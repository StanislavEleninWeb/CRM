# NOT used on the current production server, which runs Apache (see compose.host-proxy.yaml).
# For a server whose reverse proxy is the shared Caddy container
# (https://github.com/StanislavEleninWeb/caddy), use this file instead of compose.host-proxy.yaml. It and this application share one
# Docker network, created once on the host:   docker network create edge
# The proxy forwards to crm-api:8000 and crm-frontend:8080. No port of this application is published.
services:
  api:
    networks:
      edge-shared: {aliases: [crm-api]}
  frontend:
    networks:
      edge-shared: {aliases: [crm-frontend]}

networks:
  edge-shared:
    name: ${SHARED_EDGE_NETWORK:-edge}
    external: true
