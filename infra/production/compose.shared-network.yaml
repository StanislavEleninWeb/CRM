# Used on the production server together with compose.yaml. The server has one shared reverse proxy
# in a container (https://github.com/StanislavEleninWeb/caddy). It and this application share one
# Docker network, created once on the host:   docker network create edge
# The proxy forwards to crm-api:8000 and crm-frontend:8080. No port of this application is published.
services:
  api:
    networks:
      edge-shared: {aliases: [crm-api]}
  frontend:
    networks:
      edge-shared: {aliases: [crm-frontend]}

networks:
  edge-shared:
    name: ${SHARED_EDGE_NETWORK:-edge}
    external: true
