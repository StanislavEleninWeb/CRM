# Use together with compose.yaml when the host's reverse proxy runs in a container. A container
# cannot reach the host's loopback ports, so instead the proxy and this application share one
# Docker network, created once on the host:   docker network create edge
# The proxy then forwards to crm-api:8000 and crm-frontend:8080 (set CRM_API_UPSTREAM and
# CRM_FRONTEND_UPSTREAM for Caddyfile.site). No port of this application is published at all.
services:
  api:
    networks:
      edge-shared: {aliases: [crm-api]}
  frontend:
    networks:
      edge-shared: {aliases: [crm-frontend]}

networks:
  edge-shared:
    name: ${SHARED_EDGE_NETWORK:-edge}
    external: true
